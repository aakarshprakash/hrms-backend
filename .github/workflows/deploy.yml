name: Deploy Laravel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 162.241.85.117 >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o KexAlgorithms=+diffie-hellman-group-exchange-sha256 \
            aakai5l8@162.241.85.117 << 'EOF'

          set -e

          REPO="/home1/aakai5l8/repositories/hrms-backend"
          DEPLOY="/home1/aakai5l8/api.peoplenex.online"

          echo "===== Pulling Latest Code ====="
          cd "$REPO"
          git pull origin main

          echo "===== Syncing Files ====="
          /bin/rsync -av --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="storage/logs/*" \
            "$REPO/" "$DEPLOY/"

          echo "===== Installing Composer Dependencies ====="
          cd "$DEPLOY"

          /opt/cpanel/composer/bin/composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

          echo "===== Running Laravel Commands ====="

          /usr/local/bin/php artisan migrate --force
          /usr/local/bin/php artisan optimize:clear
          /usr/local/bin/php artisan optimize

          chmod -R 775 storage bootstrap/cache

          echo "===== Deployment Completed Successfully ====="

          EOF