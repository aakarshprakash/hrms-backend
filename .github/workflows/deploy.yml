- name: Deploy over SSH
  uses: appleboy/ssh-action@v1.2.2
  with:
    host: ${{ secrets.HOST }}
    username: ${{ secrets.USERNAME }}
    key: ${{ secrets.SSH_KEY }}
    port: ${{ secrets.PORT }}
    use_insecure_cipher: true
    script: |
      cd /home1/aakai5l8/repositories/hrms-backend
      git pull origin main